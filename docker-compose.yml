
services:
  postgres:
    image: postgres:17-alpine
    container_name: riyamaga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: riyamaga
      POSTGRES_USER: riyamaga
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riyamaga -d riyamaga"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
